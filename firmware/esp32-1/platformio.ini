[platformio]
default_envs = esp32dev

; ─── 모든 env 공통 ───────────────────────────────
[env]
build_flags =
    -D SCHEMA_VERSION=1
    -D FW_VERSION=\"0.1.0\"
    -D MQTT_HOST=\"172.20.10.3\"
    -D MQTT_PORT=1883
    -D HEARTBEAT_MS=30000

; ─── 실제 보드 ───────────────────────────────────
[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    bertmelis/espMqttClient@^1.7.0
build_flags =
    ${env.build_flags}
    -D SENSORS=\"vs-01:presence:ld2410c:uart2\"

; ─── 맥에서 도는 테스트 ──────────────────────────
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ${env.build_flags}
    -std=c++17