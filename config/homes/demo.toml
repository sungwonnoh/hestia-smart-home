# ============================================================ 가전
#
# 가전은 판단의 입력이면서 개입의 출력이기도 하다.
# WATCHING_TV / RESTING / FOCUSED 는 센서 신호가 동일하며
# TV 전원과 remote_input 으로만 갈린다.

