# HESTIA demo 환경 — 센서/가전 배치
#
# 이 파일은 역할 매핑의 기본값(정본)이다.
# 사용자가 대시보드에서 변경하면 hestia/registry/devices 가 이 위에 덮어쓴다.
# RPi5 는 이 파일만으로 정상 부팅한다.
#
# source: 전 항목 mock — 센서 주문 중. 실물이 오면 해당 항목만 esp32 로 바꾼다.
# node:   전 항목 esp32-1 — 노드 1개로 시작.
#         LWT 가 노드 단위이므로 이 노드가 죽으면 전 구역 판단이 SENSOR_FAULT 가 된다.

name = "demo"

# 허용 값 목록. 여기 없는 값을 쓰면 로더가 기동을 거부한다 (오타 방지).
areas = ["living", "kitchen", "bedroom", "bathroom", "utility", "entrance"]
roles = ["LIVING", "SLEEP", "MEAL", "HYGIENE", "LAUNDRY", "ENTRY", "FOCUS"]
# FOCUS 는 목록에만 둔다. 별도 작업 공간이 없어 지금은 어느 센서에도 붙이지 않는다.


# ============================================================ 거실

[[sensors]]
id = "vs-01"
type = "presence"
area = "living"
roles = ["LIVING"]
source = "mock"
node = "esp32-1"
note = "소파·탁자 mmWave"

[[sensors]]
id = "vs-02"
type = "bed"
area = "living"
roles = ["LIVING"]
source = "mock"
node = "esp32-1"
note = "소파 압력 패드"

# 한 모듈에 두 타입이면 virtual_id 를 분리한다.
# 토픽이 같으면 retained 가 서로를 덮어쓴다.
[[sensors]]
id = "vs-03l"
type = "light"
area = "living"
roles = ["LIVING"]
source = "mock"
node = "esp32-1"
note = "조도"

[[sensors]]
id = "vs-03c"
type = "climate"
area = "living"
roles = ["LIVING"]
source = "mock"
node = "esp32-1"
note = "온습도"


