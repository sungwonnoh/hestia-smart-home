# HESTIA 판단 기준값 — 집과 무관한 공통 정책
#
# 집별 배치는 config/homes/*.toml 에 있다. 이 파일은 모든 집이 공유한다.
#
# 여기 값은 대부분 **임시값**이다. 확정 근거가 둘인데 아직 없다.
#   - 벤치 측정 (B-9~B-13): 센서 노이즈, 홀드타임, 트리거 밀도
#   - Replay 스윕 (H-5): 임계값 조합을 돌려 오탐/미탐 균형 찾기
# 그래서 코드에 박지 않고 여기 둔다.


# ============================================================ 전력 판정
#
# 명세: state 는 선택 필드. 노드가 판정 가능하면 채우고,
#       없으면 RPi5 가 watt 와 이 임계값으로 판정한다.
#
#   watt <= standby_max_w                 → STANDBY
#   watt >= on_min_w                      → ON
#   ON 상태에서 watt < on_exit_w 로 떨어지면  → 내려감 (히스테리시스)
#   모든 전이는 min_hold_sec 이상 지속돼야 인정
#
# 키는 센서 ID 가 아니라 homes/*.toml 의 power_profile 라벨이다.
# "인덕션의 ON 기준은 300W"는 공통 지식이고,
# "이 집의 vs-06 이 인덕션"은 집별 정보이므로 파일을 나눈다.
# 라벨이 없거나 여기 없는 라벨이면 default 를 쓴다.

[power.default]
standby_max_w = 5
on_min_w = 50
on_exit_w = 30
min_hold_sec = 10

[power.induction]               # 대기 10W, 조리 1000~2000W
standby_max_w = 10
on_min_w = 300
on_exit_w = 150
min_hold_sec = 15

[power.microwave]               # 짧게 쓰므로 hold 를 줄인다
standby_max_w = 3
on_min_w = 500
on_exit_w = 300
min_hold_sec = 5


# ============================================================ 재실 판정
#
# 명세의 confidence 가 여기서 쓰인다.
#   mmWave (high) — 정지 상태도 감지하므로 present=false 를 즉시 신뢰
#   PIR   (low)  — 정지한 사람을 놓치므로 무반응 N분 후 이석 판정

[presence]
mmwave_absent_grace_sec = 30      # mmWave present=false 후 이 시간 뒤 이석 확정
pir_absent_timeout_sec = 300      # PIR 무반응이 이만큼 지속되면 이석 판정
area_switch_min_sec = 20          # 구역 전환 최소 지속 (오가는 떨림 방지)

# mmWave energy 임계 — 명세: "정지/미세움직임 판정은 노드가 아니라 RPi5 가"
[presence.energy]
still_max = 10                    # 이 이하면 정지
active_min = 30                   # 이 이상이면 활동 중

# 근거별 확신도.
#
# **아래 값은 전부 임시값이다.** 순서(mmWave > 압력패드 > PIR)만 센서 원리에서
# 나온 것이고 — mmWave 는 정지한 사람도 감지하고 PIR 은 놓친다 —
# 절대값은 근거가 없다.
# B-9~B-13 벤치 측정(센서별 오탐·미탐률) 후 재설정하고,
# Replay 스윕(H-5)으로 조합을 튜닝한다.
#
# method: 근거가 여럿일 때 합치는 방식.
#   max      — 가장 강한 근거 하나를 쓴다 (현재)
#   noisy_or — 1 - Π(1-p). 근거가 쌓이면 올라간다.
#              센서별 오탐률(p)을 측정한 뒤에야 의미가 있다.
[presence.confidence]
method = "max"
mmwave_active = 0.95              # present + energy >= active_min
mmwave_still = 0.85               # present + energy < active_min
bed = 0.80                        # 압력 패드 점유
pir_recent = 0.60                 # PIR motion, timeout 이내
pir_stale = 0.35                  # PIR 반응이 오래됨
runner_up_penalty = 0.5           # user_area 선택 시 2등과의 격차 반영 계수

# 화장실 쓰러짐 후보 — present=true 인데 energy 가 계속 바닥
[presence.fall_watch]
enabled = true
areas = ["bathroom"]
still_duration_sec = 600          # 10분간 정지 상태 지속
escalate_after_sec = 1800         # 30분이면 SAFETY 시나리오


# ============================================================ 부재 판정
#
# 명세의 context/away. HOME / AWAY / UNKNOWN / SENSOR_FAULT.
#
# AWAY 와 UNKNOWN 을 나누는 것은 '현관 이벤트가 있었나'다.
# 문이 열렸다 닫히고 전 구역이 조용하면 나간 것이고,
# 문은 안 열렸는데 조용하면 자고 있을 수도 쓰러졌을 수도 있다.
# 성급히 AWAY 로 가면 안전 시나리오가 전부 억제된다.

[away]
door_exit_quiet_sec = 600         # 현관 개폐 후 전 구역 무반응 지속 → AWAY
door_exit_window_sec = 1800       # 이 안에 현관 이벤트가 있었어야 door_exit 근거
no_motion_unknown_sec = 3600      # 현관 이벤트 없이 무반응 → UNKNOWN


# ============================================================ 인원 판정
#
# 명세는 근거를 셋 들지만 현재 배치로 쓸 수 있는 것은 하나뿐이다.
#   두 구역 동시 재실     ✅
#   mmWave targets 다중   ❌ 페이로드에 필드 없음 (LD2450 필요)
#   도어벨 ring 이후 증가  ❌ 도어벨 미배치
#
# MULTI 판정의 대가가 크다 — 개인 Baseline 학습 중단, 개인화 알림 중단.
# 오탐이 나면 프로젝트의 차별점이 조용히 꺼진다. 보수적으로 간다.

[occupancy]
multi_min_sec = 120               # 두 구역 동시 재실이 이만큼 지속돼야 MULTI
multi_min_confidence = 0.80       # 두 구역 모두 이 이상의 확신도여야 함
single_restore_sec = 300          # MULTI 해제 후 SINGLE 복귀까지


# ============================================================ 억제
#
# 명세의 context/suppression. 다른 context 와 성격이 다르다 —
# 센서를 읽어 세상을 추론하는 것이 아니라 엔진 자기 상태다.
# 실제 억제는 알림 코드가 메모리에서 직접 확인하고,
# 발행은 대시보드 가시성과 재시작 복원용이다.
#
# 우선순위: SLEEP_PROBE > AWAY > MULTI > COOLDOWN
# 안전 시나리오는 어떤 억제도 뚫는다.

[suppression]
cooldown_sec = 1800               # 직전 알림 후 연속 발송 방지
always_except = ["SAFETY"]        # 억제를 뚫는 시나리오


# ============================================================ activity 판정
#
# 12종 상태에 각각 점수를 매기고 가장 높은 것을 고른다.
# if-else 사슬을 쓰지 않는 이유: 조건 순서가 결과를 바꾸고,
# 상태를 하나 추가할 때마다 전체를 다시 봐야 한다.
#
# 가중치 합을 1.0 으로 맞추지 않는다. 하나를 바꿀 때 나머지를 다 조정해야 하고,
# Replay 스윕에서 축이 하나가 아니라 여럿이 된다.
# confidence 는 전체 합 대비 비율로 구한다.
#
# **값은 전부 임시값이다.** 근거가 강한 순서만 뜻이 있다.
# 벤치 측정과 Replay 스윕으로 확정한다.

[activity]
min_score = 0.35                  # 이 미만이면 UNKNOWN (open-set)
hysteresis_bonus = 0.10           # 현재 상태 유지에 주는 가산점
min_hold_sec = 60                 # 상태 최소 지속

[activity.meal]
prep_to_eating_gap_sec = 180      # 조리 종료 후 이만큼 지나면 EATING 후보
eating_min_dwell_sec = 300        # 최소 체류
fridge_recent_window_sec = 900    # 냉장고 접근을 "최근"으로 볼 창
session_timeout_sec = 7200        # FSM 강제 종료 (2시간)

[activity.sleep]
tv_idle_for_sleep_sec = 7200      # TV 무조작 2시간 — 수면 판단의 핵심 신호
bed_confirm_sec = 600             # 압력 패드 점유 지속
still_for_sleep_sec = 600         # energy 바닥이 이만큼 지속돼야 SLEEPING
wake_confirm_sec = 300            # 이탈 후 이만큼 활동하면 기상 확정
night_start_hour = 21             # 야간으로 보는 시간대
night_end_hour = 7

# 상태별 근거 가중치. 합산해 점수를 만든다.
# IN_BED_AWAKE 를 기본으로 두고 확신이 쌓일 때 SLEEPING 으로 간다 —
# 깨어 있는 사람의 조명을 끄는 쪽이 실수 비용이 크다.

[activity.weights.SLEEPING]
bed_occupied = 0.35
still_sustained = 0.30
tv_idle = 0.15
night_hours = 0.20

[activity.weights.IN_BED_AWAKE]
bed_occupied = 0.40
moving = 0.25
not_night = 0.15

[activity.weights.WAKING]
bed_left_recent = 0.45
bedroom_motion = 0.20
morning_hours = 0.15

[activity.weights.MEAL_PREP]
cooking_on = 0.60
kitchen_present = 0.25
fridge_recent = 0.10

[activity.weights.EATING]
cooking_off_recent = 0.35
kitchen_dwell = 0.30
low_energy = 0.15
fridge_recent = 0.10

[activity.weights.KITCHEN_MISC]
kitchen_present = 0.40

[activity.weights.BATHROOM]
bathroom_present = 0.85

[activity.weights.WATCHING_TV]
tv_on = 0.45
living_present = 0.25
remote_recent = 0.15

[activity.weights.RESTING]
living_present = 0.30
bed_occupied = 0.25
tv_off = 0.15

[activity.weights.LAUNDRY]
washer_running = 0.50
utility_motion = 0.25

# 개인 분포를 activity 점수에 반영하는 가중치.
#
# 0 이면 factors 에 표시만 하고 점수는 건드리지 않는다. 켜려면 셋이 선행돼야
# 한다 — 분포가 판정을 뒤집지 못할 만큼 낮은 값, sample_days 하한,
# predictability 하한. 되먹임(분포 -> activity -> t0 -> 분포)을 막기 위해서다.
[activity.baseline]
percentile_weight = 0.0
min_sample_days = 14
min_predictability = 0.12

# ============================================================ 활동 묶음 (FSM)
#
# activity 는 기억이 없다 — 매 순간 센서를 보고 다시 계산한다.
# FSM 은 "09:20 에 시작된 것이 지금도 진행 중"을 기억하고 t0 를 보관한다.
#
# t0 는 활동 묶음의 시작이다. MEAL_PREP -> EATING 전이에도 유지된다.
# KDE 가 학습하는 것은 '식사를 시작한 시각'이고 그것은 조리를 시작한 때다.

[fsm.meal]
open_states = ["MEAL_PREP", "EATING"]   # KITCHEN_MISC 는 열지 않는다 (물 마시러 들른 것)
close_grace_sec = 600                   # 묶음 상태를 벗어난 뒤 이만큼 지나면 닫는다
min_duration_sec = 120                  # 이보다 짧으면 기록하지 않는다
session_timeout_sec = 7200              # 강제 종료 (2시간)

[fsm.wake]
# activity 는 '지금'이고 wake 는 '오늘 하루의 누적'이다. 시간 스케일이 달라
# 별도로 유지한다. 다음 기상 확정 시 리셋한다.
sleep_confirm_sec = 600                 # SLEEPING 이 이만큼 지속돼야 ASLEEP 확정
wake_confirm_sec = 300                  # 기상 후 이만큼 활동하면 AWAKE 확정
hydration_window_sec = 7200             # 기상 후 이 안의 급수를 루틴으로 본다
meal_window_sec = 10800                 # 기상 후 이 안의 식사를 루틴으로 본다
# 기상으로 인정하는 시간대. 새벽 화장실과 아침 기상은 센서 신호가 같다.
earliest_hour = 4
latest_hour = 12

# ============================================================ 이상 판정
#
# KDE 분포와 대조해 개입 후보를 만드는 기준.

[thresholds.meal]
tail_max = 0.05
# predictability_min 은 현재 baseline.py 의 **정규화 안 된** 스케일 기준이다.
# 검증표상 std 75분이 넘어야 걸리는 값이라 사실상 전부 통과한다.
# 명세는 predictability 를 0~1 로 정의하므로, D 트랙에서 정규화를 맞춘 뒤
# 이 값을 다시 잡아야 한다. (그전까지 "불규칙한 사람은 개입 안 함"이 작동하지 않음)
predictability_min = 0.05

[thresholds.wake]
tail_max = 0.05
predictability_min = 0.05

[thresholds.hydration]
tail_max = 0.10                   # 수분은 느슨하게 — 놓치는 쪽이 더 나쁨
predictability_min = 0.05


# ============================================================ 알림 정책
#
# 명세의 notify_policy. 채널 선호·데드라인·쿨다운·comply 창.
# 알림 층을 만들 때 채운다. 지금은 골격만.

[notify.default]
requires_ack = false
ack_deadline_sec = 600
cooldown_sec = 1800
comply_window_min = 30
expiry_sec = 3600                 # 이 시각이 지나면 보내지 않는다 (명세의 expiry)
max_escalation = 2                # 명세: 최대 2단계. SAFETY 만 예외
affinity = ["smart_tv", "smart_fridge"]   # default 에도 필요 — 시나리오가 생략할 수 있음

[notify.WAKE_ROUTINE]
affinity = ["smart_fridge", "smart_tv"]
comply_window_min = 30

[notify.MEDICATION_PROMPT]
affinity = ["smart_fridge", "smart_tv"]
requires_ack = true               # 복약은 이벤트로 판정 불가
comply_window_min = 60

[notify.SAFETY]
affinity = ["smart_tv", "smart_light", "voice"]
requires_ack = true
ack_deadline_sec = 120
cooldown_sec = 0
max_escalation = 0                # 0 = 무제한. ack 수신까지 지속


# ============================================================ 총량 제한
#
# 명세: 각각은 규칙을 지켰는데 총량이 과한 상황을 막는다.

[limits]
max_per_day = 8
min_interval_sec = 1800
quiet_hours = { start = "22:00", end = "07:00" }   # 음성 채널 금지 시간대


# ============================================================ 관측 창
#
# 개입 후 사용자 반응을 지켜보는 시간. 명세: 조명은 짧고 온도는 길다.

[observe.default]
window_sec = 600

[observe.smart_light]
window_sec = 180                  # 되돌림이 즉각적

[observe.air_conditioner]
window_sec = 1800                 # 체감에 시간이 걸림

[observe.robot_cleaner]
window_sec = 900


# ============================================================ DEMO 프로파일
#
# 명세: DEMO 에서 쿨다운 단축, 타임아웃 축소, 관측 창 단축.
# 아래 배수를 위 값들에 곱한다.

[profile.DEMO]
cooldown_scale = 0.1
timeout_scale = 0.1
observe_scale = 0.1


# ============================================================ 발행
#
# 명세: 상태 변화 시 즉시 + 5분 주기(생존 확인)
# 주기 발행은 DEMO 배수를 적용하지 않는다.

[publish]
interval_sec = 300